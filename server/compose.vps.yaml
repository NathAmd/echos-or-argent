services:
  social-signaling:
    image: "${SERVER_IMAGE:?Set SERVER_IMAGE to the GHCR server image tag or digest}"
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-8787}"
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    volumes:
      - social-signaling-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  social-signaling-data:
